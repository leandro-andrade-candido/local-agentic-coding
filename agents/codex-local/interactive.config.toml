# Interactive profile of the local Codex ($CODEX_HOME/interactive.config.toml, --profile interactive).
# Asks for approval when the model wants to leave the sandbox; the sandbox (bubblewrap +
# seccomp on Linux) only allows writing to the workspace and /tmp, without network.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
