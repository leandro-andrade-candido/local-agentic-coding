# Codex CLI 0.165.x with the local llama-server (Responses endpoint /v1/responses).
# Generated in $CODEX_HOME/config.toml by run.sh/codex-local (agents/lib/render.py).
# The profile (interactive/autonomous) lives in $CODEX_HOME/<profile>.config.toml and is
# chosen with --profile. Keys checked against the Configuration Reference
# (developers.openai.com/codex/config-reference) and the rust-v0.165.0 tag code.

model = "@@LLM_MODEL@@"
model_provider = "llamacpp"

# Server window. Codex uses 95% of it as the effective window.
model_context_window = @@INT:LLM_CONTEXT@@
# Compacts at ~75% (98k of 131k). Codex does not send an output limit
# (max_output_tokens), so the headroom for the response comes from here and the server's -n.
model_auto_compact_token_limit = @@INT:CODEX_AUTO_COMPACT@@

# Reasoning: Qwen3.6 thinks via the template. No reasoning metadata
# (reasoning.effort/summary), which llama.cpp ignores or translates into template kwargs.
model_supports_reasoning_summaries = false
model_reasoning_summary = "none"
# Shows the raw reasoning (llama.cpp reasoning_text) in the exec events and the TUI.
show_raw_agent_reasoning = true
# Removes the "Personality" section from the base instructions (smaller prompt).
personality = "none"

# No web search (llama.cpp discards tools that are not "function").
web_search = "disabled"
check_for_update_on_startup = false

[model_providers.llamacpp]
name = "llama.cpp local"
base_url = "@@LLM_BASE_URL@@/v1"
wire_api = "responses"
# llama-server key read from the environment (LOCAL_LLM_API_KEY, see agents/lib/common.sh).
env_key = "LOCAL_LLM_API_KEY"
request_max_retries = 2
stream_max_retries = 2
# A ~100k-token prefill takes minutes with no byte on the stream.
stream_idle_timeout_ms = 1800000
supports_websockets = false

[model_providers.llamacpp.capabilities]
# Local compaction (llama.cpp does not have the remote compaction protocol).
remote_compaction = "unsupported"
external_web_access = false

[analytics]
# Also turns off the metrics exporter (default: statsig).
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false

[features]
# Connectors, the remote plugin catalog and fast modes depend on the OpenAI account.
apps = false
remote_plugin = false
fast_mode = false
ultrafast_mode = false
skill_mcp_dependency_install = false
# Subagents, goals with automatic continuation and memories generate extra
# requests; with a single slot, each one evicts the main prompt from the cache.
multi_agent = false
goals = false
memories = false
hooks = true

[tui]
# The automatic recap calls the model when the terminal loses focus.
auto_recap = false
show_tooltips = false

# Common guard (agents/lib/guard.py) before every shell command.
# Unmanaged hooks require trust: run.sh and codex-local pass
# --dangerously-bypass-hook-trust (the hook is this one, generated by the repository).
[[hooks.PreToolUse]]
matcher = "Bash"
hooks = [
  { type = "command", command = "python3 -I \"@@AGENT_GUARD@@\"", timeout = 15, statusMessage = "local-guard" },
]
