# Eval profile ($CODEX_HOME/autonomous.config.toml, --profile autonomous).
# No approvals and no Codex sandbox: isolation is the E7 container
# (Codex's bubblewrap cannot create namespaces inside an unprivileged Docker
# container). "forbidden" rules (rules/) and the guard hook still apply.
# Outside the container (only with AGENT_ALLOW_HOST_AUTONOMOUS=1, unsafe): CODEX_LOCAL_SANDBOX=workspace-write.
approval_policy = "never"
sandbox_mode = "danger-full-access"
